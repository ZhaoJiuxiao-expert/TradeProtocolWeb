<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#113c35"><title>有据 · 模拟交易市场</title>
<style>
:root{--ink:#142f29;--green:#155448;--line:#d9dfd4;--paper:#f4f5ee;--muted:#52675d;--mint:#c5ed96}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Inter","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d27937;outline-offset:3px}.wrap{max-width:1200px;margin:auto;padding:0 36px}header{border-bottom:1px solid var(--line);background:#fbfcf6}header .wrap,.bar,.section-title,.row{display:flex;align-items:center;justify-content:space-between;gap:14px}header .wrap{min-height:72px}.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:850;letter-spacing:.05em}.mark{display:grid;place-items:center;width:38px;height:38px;background:var(--green);border-radius:10px;color:var(--mint);font:bold 28px/1 Georgia}.wallet{font-size:13px;color:var(--muted)}.wallet b{color:var(--ink);font:700 18px/1.4 Consolas,monospace}.hero{position:relative;overflow:hidden;isolation:isolate;margin:28px 0 21px;padding:clamp(24px,5vw,57px);border-radius:22px;color:#f9fbed;background:#123e34}.hero:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 81% 92%,#346752,transparent 50%),repeating-linear-gradient(90deg,transparent 0 47px,#fff1 48px),repeating-linear-gradient(0deg,transparent 0 47px,#fff1 48px);opacity:.65}.eyebrow{display:flex;align-items:center;gap:10px;font:600 12px/1.3 Consolas,monospace;letter-spacing:.16em;color:#d2e9bd}.eyebrow i{width:8px;height:8px;background:var(--mint);border-radius:50%}h1{font-size:clamp(34px,4vw,57px);letter-spacing:-.055em;line-height:1.2;margin:17px 0 8px}.hero p{color:#dce8d6;margin:0}.art{position:absolute;right:7%;top:50%;width:165px;height:145px;transform:translateY(-50%) rotate(-10deg);z-index:-1}.art i{position:absolute;inset:0;border:2px solid #c4ec99;border-radius:15px;background:linear-gradient(135deg,#55795a,#275649);transform:skew(-19deg,-6deg) scaleY(.58)}.art i:nth-child(1){top:46px;bottom:-46px}.art i:nth-child(2){top:23px;bottom:-23px}.art i:last-child{background:repeating-linear-gradient(0deg,transparent 0 19px,#40654044 20px),linear-gradient(135deg,#d5efac,#86b576)}.art i:last-child:after{content:"✓";display:grid;place-items:center;height:100%;font:bold 60px Georgia;color:#255844}.bar{border-bottom:1px solid var(--line);padding:0 0 12px;flex-wrap:wrap}nav,.filters,.actions{display:flex;gap:7px;flex-wrap:wrap}button{color:var(--ink);border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 14px;font-weight:600}nav button,.filters button{background:transparent;border-color:transparent}nav button.active,.primary{background:var(--green);color:white;border-color:var(--green)}.filters button{padding:5px 11px;font-size:13px}.filters button.active{background:#dcebd3}.section-title{margin:28px 0 17px;flex-wrap:wrap}h2{font-size:25px;margin:0;letter-spacing:-.04em}h3{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card,.record,.empty{border:1px solid var(--line);border-radius:15px;background:#fffef9;padding:21px}.card{display:flex;flex-direction:column;gap:13px;min-width:0}.card h3,.record h3,.detail p,.small{overflow-wrap:anywhere}.small,small{font-size:13px;color:var(--muted)}.price{font:700 23px/1.3 Consolas,monospace}.price:before{content:"¥";font-size:.65em;margin-right:3px}.tag,.state{display:inline-block;padding:3px 9px;border-radius:5px;background:#e6eedd;color:#375a44;font-size:12px;font-weight:700}.state{background:#f4e8cf;color:#745328}.card footer{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.muted{color:var(--muted)}.record{margin-bottom:11px}.record p,.detail p{margin:7px 0}.actions{margin-top:12px}.empty{grid-column:1/-1;color:var(--muted)}.note{padding:12px 15px;border-left:3px solid #80a46d;background:#edf2e7;font-size:14px}.ledger{display:grid;grid-template-columns:70px 1fr 2fr;gap:14px;align-items:center}.ledger code{font-size:12px;overflow-wrap:anywhere;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:17px;box-shadow:0 20px 80px #1233;max-width:min(520px,94vw);width:520px;color:var(--ink);padding:24px;max-height:88vh}dialog::backdrop{background:#0d221e81}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.close{font-size:20px;padding:0;width:34px;height:34px}label{display:grid;gap:4px;margin:10px 0;font-size:14px;font-weight:600}input,textarea,select{border:1px solid #b7c3b7;border-radius:7px;padding:8px;background:#fff;color:var(--ink);min-width:0;width:100%}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.error{color:#953b22;white-space:pre-line}.statusmsg{margin:10px 0;color:var(--green)}.statusmsg:empty,.error:empty{display:none}.stage{display:grid;grid-template-columns:1fr 100px auto;gap:6px;margin-bottom:7px}main{padding-bottom:55px!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{right:4%;width:140px}}@media(max-width:620px){.wrap{padding:0 16px}.hero{margin-top:16px}.hero p{max-width:70%;font-size:13px}.art{width:74px;height:88px;right:6%;opacity:.7}.art i:last-child:after{font-size:30px}.grid{grid-template-columns:1fr}.wallet{text-align:right}.wallet b{display:block}.bar{gap:7px}nav button{padding:7px 9px}.bar>.primary{padding:7px 10px}.ledger{grid-template-columns:48px 1fr}.ledger code{grid-column:1/-1}.card{padding:17px}}
</style></head><body><header><div class="wrap"><div class="brand"><span class="mark" aria-hidden="true">≋</span>有据</div><div class="wallet">我的模拟余额　<b id="balance">—</b></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow"><i></i> 模拟交易 / MARKET</div><h1>交易市场</h1><p>买方托管款项，卖方按约交付，双方核对交易记录。</p><div class="art" aria-hidden="true"><i></i><i></i><i></i></div></section>
<div class="bar"><nav aria-label="主导航"><button data-tab="market" class="active">逛市场</button><button data-tab="mine">我的交易</button><button data-tab="ledger">交易记录</button></nav><button class="primary" id="publish">＋ 发布商品</button></div><div role="status" id="notice" class="statusmsg"></div><div id="view" aria-live="polite"><p>正在读取市场…</p></div></main><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button class="close" aria-label="关闭" id="close">×</button></div><div id="body"></div><p class="error" role="alert" id="error"></p></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), view=$('#view'), modal=$('#modal'), body=$('#body');
const categories={camera:'相机器材',game:'游戏资产',service:'分阶段服务'}, statuses={open:'在售',funded:'待交付',delivered:'待验收',disputed:'争议协商中',closed:'已完成',resolved:'已协商结案'};
const actionNames={list:'发布商品',buy:'买方托管',deliver:'卖方交付',settle:'确认结算',dispute:'发起争议',resolve:'协商结案'};
let state,tab='market',filter='all',pending=false,ticket=0,selected=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const money=v=>(Number(v)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const demo=x=>Boolean(x.demo)||['demo','demo-seller'].includes(x.seller);
const itemById=id=>state.items.find(x=>String(x.id)===String(id));
function note(s){$('#notice').textContent=s}
function openDialog(title,html){$('#modalTitle').textContent=title;body.innerHTML=html;$('#error').textContent='';if(!modal.open)modal.showModal()}
function closeDialog(){if(!pending){modal.close();selected=null}}
$('#close').onclick=closeDialog;modal.addEventListener('cancel',e=>{if(pending)e.preventDefault()});modal.addEventListener('close',()=>{selected=null});
async function api(url,params){const r=await fetch(url,params);let data;try{data=await r.json()}catch{throw Error('服务器未返回有效结果，请稍后刷新。')}if(!r.ok||data.error)throw Error(data.error||'请求失败，请稍后重试。');return data}
async function refresh(){const n=++ticket;const s=await api('/api/state',{cache:'no-store'});if(n===ticket){state=s;render()}}
function render(){if(!state)return;$('#balance').textContent='¥'+money(state.balance);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='ledger'){view.innerHTML='<div class="section-title"><h2>交易记录</h2><a href="/api/ledger" download>下载账本</a></div><p class="small">累计模拟平台费 ¥'+money(state.fees)+'。记录由单站维护，可下载快照核对历史哈希。</p>'+([...state.blocks].sort((a,b)=>(b.index??b.height)-(a.index??a.height)).map(b=>'<div class="record ledger"><b>#'+esc(b.index??b.height)+'</b><span>'+esc(actionNames[b.action]||b.action)+'</span><code>'+esc(b.hash)+'</code></div>').join('')||'<p class="empty">暂无交易记录。</p>');return}
if(tab==='mine'){const mine=state.items.filter(x=>x.seller===state.me||x.buyer===state.me);view.innerHTML='<div class="section-title"><h2>我的交易</h2><button data-refresh>刷新</button></div><p class="small">当前模拟账户 '+esc(state.me)+' · 不同浏览器配置可作为独立买家或卖家。</p>'+(mine.map(x=>'<article class="record"><div class="row"><h3>'+esc(x.title)+'</h3><span class="state">'+esc(statuses[x.status])+'</span></div><p class="small">'+(x.seller===state.me?'我卖出的':'我买到的')+' · ¥'+money(x.price)+'</p><button data-id="'+esc(x.id)+'">查看交易</button></article>').join('')||'<p class="empty">还没有交易。你可以逛市场，或发布自己的商品。</p>');return}
const listings=state.items.filter(x=>x.status==='open'&&(filter==='all'||x.category===filter));const groups=new Map();for(const x of listings){const key=x.category==='camera'?'c:'+String(x.title).normalize('NFKC').replace(/\s+/g,'').toLowerCase():'i:'+x.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}
view.innerHTML='<div class="section-title"><h2>在售商品</h2><div class="filters">'+Object.entries({all:'全部',...categories}).map(([k,v])=>'<button class="'+(filter===k?'active':'')+'" data-filter="'+k+'">'+v+'</button>').join('')+'</div></div><div class="grid">'+([...groups.values()].map(group=>{group.sort((a,b)=>a.price-b.price);const x=group[0];return '<article class="card"><div class="row"><span class="tag">'+esc(categories[x.category])+'</span><small>'+ (group.some(k=>demo(k))?'含演示卖家':x.seller===state.me?'我的发布':'用户发布')+'</small></div><h3>'+esc(x.title)+'</h3><div class="small">'+(x.category==='camera'?group.length+' 个报价 · 可比较成色与交期':x.category==='service'?(x.stages||[]).length+' 个交付阶段':'交付后由买家验收')+'</div><footer class="row"><span><b class="price">'+money(x.price)+'</b>'+(group.length>1?' 起':'')+'</span><button data-id="'+esc(x.id)+'" data-group="'+esc(group.map(u=>encodeURIComponent(u.id)).join(','))+'">查看'+(group.length>1?'报价':'详情')+'</button></footer></article>'}).join('')||'<p class="empty">这个分类暂无在售商品。</p>')+'</div>'}
function showItem(id,ids=[]){const x=itemById(id);if(!x)return;selected=id;const buyer=x.buyer===state.me,seller=x.seller===state.me,active=['funded','delivered'].includes(x.status);const opts=ids.map(itemById).filter(Boolean);let buttons=[];
if(x.status==='open'&&!seller)buttons.push(['buy','托管 ¥'+money(x.price)+' 并购买']);if(seller&&x.status==='funded')buttons.push(['deliver','标记本阶段已交付']);if(buyer&&x.status==='delivered')buttons.push(['settle','验收并结算本阶段']);if((buyer||seller)&&active)buttons.push(['dispute','发起争议']);if((buyer||seller)&&x.status==='disputed'&&x.disputer!==state.me)buttons.push(['resolve','同意平分剩余托管款']);
let info='<div class="detail"><div class="row"><span class="tag">'+esc(categories[x.category])+'</span><span class="state">'+esc(statuses[x.status])+'</span></div><h3 style="margin:14px 0">'+esc(x.title)+'</h3>';
if(opts.length>1)info+='<label>选择卖家报价<select id="offer">'+opts.map(u=>'<option value="'+esc(u.id)+'" '+(u.id===x.id?'selected':'')+'>¥'+money(u.price)+' · '+esc(u.condition)+' 级 · '+esc(demo(u)?'演示卖家':u.seller)+'</option>').join('')+'</select></label>';
info+='<p class="price">'+money(x.price)+'</p><p class="small">卖家 '+esc(demo(x)?'演示卖家':x.seller)+(seller?'（我）':'')+'</p>';
if(x.category==='camera')info+='<p>成色 '+esc(x.condition)+' 级 · 交付 '+esc(x.days)+' 天 · 保修 '+esc(x.warranty)+' 天</p>';
if(x.credit!=null)info+='<p class="small">卖家信用 '+esc(x.credit)+'</p>';
if(x.category==='camera'){info+='<p class="small">'+[x.model,x.kit,x.finish].map(esc).join(' · ')+'</p>';for(const [caption,ref] of [['卖家等权参考价',x.reference],['订单等权参考价',x.orderReference]]){if(ref)info+='<p class="small">'+caption+' · '+(ref.median==null?'样本不足':('¥'+money(ref.median)))+'（'+esc(ref.count)+' 笔 / '+esc(ref.sellers)+' 位卖家）'+(ref.flag==='high'?' · 报价偏高':ref.flag==='low'?' · 报价偏低':'')+'</p>'}}
if(x.stages?.length)info+='<ol>'+x.stages.map((s,i)=>'<li>'+esc(s.name)+' · ¥'+money(s.amount)+(active&&i===x.stage?'（当前）':'')+'</li>').join('')+'</ol>';
info+='<p class="note">'+(demo(x)?'演示卖家会自动交付，并可自动回应协商。':'')+'购买时全额托管，每次向卖家付款时收取 2% 平台费。</p>';if(x.status==='disputed')info+='<p>等待发起方的交易对手同意平分剩余托管款。</p>';if(x.reason)info+='<p>争议说明：'+esc(x.reason)+'</p>';if(x.status!=='open')info+='<p class="small">剩余托管 ¥'+money(x.escrow??0)+' · 已退回买家 ¥'+money(x.refunded??0)+'</p>';if(x.feePaid)info+='<p>已收平台费 ¥'+money(x.feePaid)+'</p>';
if(buttons.some(([a])=>a==='dispute'))info+='<label>争议说明（公开记录，可选）<input id="reason" maxlength="160"></label>';info+='<div class="actions">'+buttons.map(([a,label])=>'<button data-act="'+a+'" class="'+(a==='dispute'?'':'primary')+'">'+label+'</button>').join('')+'</div></div>';openDialog('交易详情',info);if($('#offer'))$('#offer').onchange=e=>showItem(e.target.value,ids)}
</script>
<script>
const formHTML='<form id="listing"><label>商品名称<input name="title" required maxlength="80" autocomplete="off"></label><div class="cols"><label>分类<select name="category"><option value="camera">相机器材</option><option value="game">游戏资产</option><option value="service">分阶段服务</option></select></label><label>总价（模拟元）<input name="price" type="number" min=".01" step=".01" required></label></div><div id="cameraFields"><label>成色<select name="condition"><option value="A">A 级</option><option value="B">B 级</option><option value="C">C 级</option></select></label><div class="cols"><label>交付天数<input type="number" name="days" min="1" max="365" value="3" required></label><label>保修天数<input type="number" name="warranty" min="0" max="3650" value="0" required></label></div><details><summary>型号、套装与外观</summary><label>型号<input name="model" placeholder="默认使用商品名称"></label><div class="cols"><label>套装<input name="kit" placeholder="标准"></label><label>外观<input name="finish" placeholder="标准"></label></div></details></div><div id="stageFields" hidden><p>交付阶段</p><div id="stages"></div><button type="button" id="addStage">＋ 添加阶段</button><p class="small">各阶段金额合计须等于总价。</p></div><p class="note">每次向卖家付款时收取 2% 平台费。</p><button type="submit" class="primary">确认发布</button></form>';
function addStage(){const row=document.createElement('div');row.className='stage';row.innerHTML='<input aria-label="阶段名称" placeholder="阶段名称" maxlength="40"><input type="number" min=".01" step=".01" placeholder="金额" aria-label="阶段金额"><button type="button" aria-label="删除阶段">×</button>';row.querySelector('button').onclick=()=>row.remove();$('#stages').append(row)}
$('#publish').onclick=()=>{if(!state){note('市场尚未连接。');return}selected=null;openDialog('发布商品',formHTML);const f=$('#listing');addStage();$('#addStage').onclick=addStage;f.elements.category.onchange=()=>{const c=f.elements.category.value;$('#cameraFields').hidden=c!=='camera';$('#stageFields').hidden=c!=='service'};f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),price=Math.round(Number(d.price)*100),stages=d.category==='service'?[...document.querySelectorAll('.stage')].map(row=>({name:row.children[0].value.trim(),amount:Math.round(Number(row.children[1].value)*100)})):[{name:'商品交付',amount:price}];if(!stages.length||stages.some(s=>!s.name||s.amount<1)||stages.reduce((n,s)=>n+s.amount,0)!==price){$('#error').textContent='请填写所有阶段的名称和金额，并确保合计等于总价。';return}for(const k of ['model','kit','finish'])if(!d[k].trim())delete d[k];send({...d,action:'list',title:d.title.trim(),price,days:Number(d.days),warranty:Number(d.warranty),stages})}};
let repeatKey=null;
async function send(data){if(pending)return;pending=true;$('#error').textContent='';const serial=JSON.stringify(data);if(repeatKey?.serial!==serial)repeatKey={serial,key:globalThis.crypto.randomUUID?.()||Array.from(globalThis.crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('')};modal.querySelectorAll('button').forEach(b=>b.disabled=true);
try{++ticket;state=await api('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,idempotencyKey:repeatKey.key})});repeatKey=null;tab='mine';render();modal.close();note('已完成'+actionNames[data.action]+'。')}catch(e){$('#error').textContent=e.message}finally{pending=false;modal.querySelectorAll('button').forEach(b=>b.disabled=false)}}
body.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const reason=$('#reason')?.value.trim()||'';send({action:a.dataset.act,id:selected,...(reason?{reason}:{}),...(a.dataset.act==='resolve'?{reason:'双方同意平分剩余托管款'}:{})})});
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;note('');render();refresh().catch(e=>note(e.message))}};
view.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.id){showItem(b.dataset.id,(b.dataset.group||'').split(',').filter(Boolean).map(decodeURIComponent))}else if(b.hasAttribute('data-refresh'))refresh().catch(e=>note(e.message))};
refresh().catch(e=>{view.innerHTML='<p class="empty">市场加载失败。 <button data-refresh>重新加载</button></p>';note(e.message)});
</script></body></html>
