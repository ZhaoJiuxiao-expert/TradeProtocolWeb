:root{--ink:#142f29;--green:#155448;--line:#d9dfd4;--paper:#f4f5ee;--muted:#52675d;--mint:#c5ed96}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Inter","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d27937;outline-offset:3px}.wrap{max-width:1200px;margin:auto;padding:0 36px}header{border-bottom:1px solid var(--line);background:#fbfcf6}header .wrap,.bar,.section-title,.row{display:flex;align-items:center;justify-content:space-between;gap:14px}header .wrap{min-height:72px}.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:850;letter-spacing:.05em}.mark{display:grid;place-items:center;width:38px;height:38px;background:var(--green);border-radius:10px;color:var(--mint);font:bold 28px/1 Georgia}.wallet{font-size:13px;color:var(--muted)}.wallet b{color:var(--ink);font:700 18px/1.4 Consolas,monospace}.hero{position:relative;overflow:hidden;isolation:isolate;margin:28px 0 21px;padding:clamp(24px,5vw,57px);border-radius:22px;color:#f9fbed;background:#123e34}.hero:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 81% 92%,#346752,transparent 50%),repeating-linear-gradient(90deg,transparent 0 47px,#fff1 48px),repeating-linear-gradient(0deg,transparent 0 47px,#fff1 48px);opacity:.65}.eyebrow{display:flex;align-items:center;gap:10px;font:600 12px/1.3 Consolas,monospace;letter-spacing:.16em;color:#d2e9bd}.eyebrow i{width:8px;height:8px;background:var(--mint);border-radius:50%}h1{font-size:clamp(34px,4vw,57px);letter-spacing:-.055em;line-height:1.2;margin:17px 0 8px}.hero p{color:#dce8d6;margin:0}.art{position:absolute;right:7%;top:50%;width:165px;height:145px;transform:translateY(-50%) rotate(-10deg);z-index:-1}.art i{position:absolute;inset:0;border:2px solid #c4ec99 mplate-columns:45px 1fr}.modalhead{gap:10px}.hero p{max-width:77%}.bar{align-items:flex-start}.hero{border-radius:16px}nav{gap:2px}nav button{font-size:14px}}

<main class="wrap"><section class="hero"><div class="eyebrow"><i></i> 个人卖家 / 闲鱼成交</div><h1>个人卖家市场</h1><p>到闲鱼下单和付款。实际收货、到账后，双方回来核对同一笔订单。</p><div class="art" aria-hidden="true"><i></i><i></i><i></i></div></section>
<div class="bar"><nav aria-label="个人卖家市场导航"><button data-nav="open" aria-current="page">在售商品</button><button data-nav="mine">我的交易</button><button data-nav="ledger">成交账本</button></nav><button class="primary" id="publish" disabled>＋ 发布闲鱼商品</button></div>
<p id="notice" class="notice" role="status"></p><section id="content"><p>正在读取商品…</p></section></main>
<dialog id="modal" aria-labelledby="title"><div class="dialoghead"><h2 id="title"></h2><button id="close" class="close" aria-label="关闭">×</button></div><div id="body"></div><p role="alert" id="err" class="error"></p></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s),modal=$('#modal'),panel=$('#body'),content=$('#content');
const categories={camera:'相机器材',game:'游戏资产',service:'服务'},states={open:'在售',pending:'等待双方确认',completed:'双方已确认',withdrawn:'已撤下',disputed:'有争议'},sections={open:'在售商品',mine:'我的交易',ledger:'成交账本'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yuan=c=>'¥'+(Number(c)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=t=>new Date(t).toLocaleString('zh-CN',{hour12:false});
function official(v){try{const u=new URL(v),id=u.searchParams.get('id');if(!['www.goofish.com','goofish.com'].includes(u.hostname)||u.protocol!=='https:'||u.port||u.username||u.password||u.pathname!=='/item'||u.searchParams.getAll('id').length!==1||!/^[1-9][0-9]{0,30}$/.test(id||''))return '';return 'https://www.goofish.com/item?id='+id}catch{return ''}}
let st=null,tab='open',sel=null,screen=null,busy=false,turn=0,retry=null;
function item(){return st?.items.find(i=>i.id===sel)}
function notice(s){$('#notice').textContent=s}
function show(title,html,which){screen=which;$('#title').textContent=title;panel.innerHTML=html;$('#err').textContent='';if(!modal.open)modal.showModal()}
function close(){if(!busy){modal.close();panel.replaceChildren();sel=null;screen=null}}
$('#close').onclick=close;modal.addEventListener('cancel',e=>{e.preventDefault();close()});
async function api(path,options){const r=await fetch('/api/personal/'+path,{cache:'no-store',...options});let j;try{j=await r.json()}catch{throw Error('无法读取服务器响应，请刷新重试。')}if(!r.ok||j.error)throw Error(j.error||'操作失败，请刷新后重试。');return j}
async function reload(){const t=++turn;const j=await api('state');if(t!==turn)return;const previous=item();st=j;render();if(!modal.open||!sel)return;const i=item();if(!i){close();notice('商品状态已更新。');return}if(screen==='detail'||previous?.status!==i.status||Boolean(previous?.buyerConfirmed)!==Boolean(i.buyerConfirmed)||Boolean(previous?.sellerConfirmed)!==Boolean(i.sellerConfirmed))detail()}
function render(){if(!st)return;$('#publish').disabled=false;document.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const head='<div class="section-title"><h2>'+sections[tab]+'</h2><div>'+(tab==='ledger'?'<a href="/api/personal/ledger" download>下载账本</a>':'')+'<button data-refresh>刷新</button></div></div>';
if(tab==='ledger'){content.innerHTML=head+'<p class="small">仅在双方分别声明收货与到账、且填写的闲鱼订单号匹配后记入。本站未接入闲鱼订单或资金接口。</p>'+([...st.blocks].sort((a,b)=>b.index-a.index).map(b=>'<article class="record ledger"><b>#'+esc(b.index)+'</b><div>双方确认成交<br><small>'+esc(date(b.time))+'</small></div><code>'+esc(b.hash)+'</code></article>').join('')||'<div class="empty">暂无双方确认的成交记录。</div>');return}
const items=st.items.filter(i=>tab==='open'?i.status==='open':i.buyer===st.me||i.seller===st.me);
content.innerHTML=head+(tab==='mine'?'<p class="small">此浏览器的站点数据用于识别你的身份。请保留该数据，以便回来确认订单。</p>':'<p class="small">个人卖家可关联自己的闲鱼商品，无需微信支付商户号。付款、物流、退款和售后均在闲鱼处理；本站独立运营，与闲鱼无隶属关系。</p><p class="small">还没有闲鱼商品？先在闲鱼发布，再把商品链接添加到这里。 <a href="https://www.goofish.com/" target="_blank" rel="noopener noreferrer">去闲鱼官网 ↗</a></p>')+'<div class="grid">'+(items.map(i=>'<article class="card"><div class="row"><span class="tag">'+esc(categories[i.category])+'</span><span class="state">'+esc(states[i.status]||i.status)+'</span></div><h3>'+esc(i.title)+'</h3><span class="small merchant">闲鱼卖家（自报）　'+esc(i.sellerName||i.seller)+'</span><div class="small terms">'+esc(i.terms)+'</div><footer class="row"><b class="price">'+yuan(i.price)+'</b><button data-id="'+esc(i.id)+'">'+(tab==='open'?'查看商品':'查看进度')+'</button></footer></article>').join('')||'<div class="empty"><strong>'+(tab==='open'?'目前没有在售闲鱼商品':'还没有你的交易')+'</strong>'+(tab==='open'?'卖家可发布自己在闲鱼上架的商品。':'你发布或登记的商品会显示在这里。')+'</div>')+'</div>'}
function summary(i){const safe=official(i.externalUrl);return '<div class="detail"><div class="row"><span class="tag">'+esc(categories[i.category])+'</span><span class="state">'+esc(states[i.status]||i.status)+'</span></div><h3 style="margin:13px 0 3px">'+esc(i.title)+'</h3><p style="font-size:23px;font-weight:700">'+yuan(i.price)+'</p><dl><dt>闲鱼卖家昵称（卖家自报）</dt><dd>'+esc(i.sellerName||i.seller)+'</dd><dt>本站卖家账户</dt><dd>'+esc(i.seller)+'</dd><dt>商品及交付约定</dt><dd class="terms">'+esc(i.terms)+'</dd></dl>'+(safe?'<a class="linkbtn" href="'+esc(safe)+'" target="_blank" rel="noopener noreferrer">去闲鱼核对商品 ↗</a>':'<p class="error">当前商品缺少有效的闲鱼官方商品链接。</p>')+'</div>'}
function allowed(i){const s=i.seller===st.me,b=i.buyer===st.me;if(i.status==='open')return s?['cancel']:official(i.externalUrl)?['claim']:[];if((!b&&!s)||i.status!=='pending')return[];const a=[];a.push('confirm');if(!i.sellerConfirmed&&!i.buyerConfirmed)a.push('cancel');a.push('dispute');return a}
function label(a,i){return {claim:'登记为买家',confirm:(i.seller===st.me?i.sellerConfirmed:i.buyerConfirmed)?'更正已填的闲鱼单号':i.seller===st.me?'确认闲鱼已实际放款到账':'确认本人已实际收货',cancel:i.status==='open'?'撤下商品':'撤回本次登记',dispute:'记录争议'}[a]}
function detail(){const i=item();if(!i)return;const flags=i.status==='pending'||i.status==='completed'?'<div class="status-text"><div class="flag">买家实际收货<span>'+((i.buyerConfirmed||i.status==='completed')?'已自行确认':'等待确认')+'</span></div><div class="flag">卖家实际到账<span>'+((i.sellerConfirmed||i.status==='completed')?'已自行确认':'等待确认')+'</span></div></div>':'';
let msg={open:'先在闲鱼核对商品、卖家昵称与价格。登记后仍须自行在闲鱼下单和付款。',pending:'请在闲鱼完成交易。收货或到账后，各自在这里输入同一笔闲鱼订单号；原始单号不公开。',completed:'双方对同一笔闲鱼订单完成了确认，记录已进入成交账本。',disputed:'本站已停止这笔登记的成交确认。请在闲鱼订单中处理争议及退款。',withdrawn:'卖家已在本站撤下这件商品。'}[i.status]||'';
show(i.status==='open'?'商品详情':'交易进度',summary(i)+flags+'<p class="note">'+msg+'</p><div class="actions">'+allowed(i).map((a,n)=>'<button class="'+(!n?'primary':'')+'" data-flow="'+a+'">'+label(a,i)+'</button>').join('')+'</div>','detail')}
function flow(a){const i=item();if(!i||!allowed(i).includes(a)){detail();return}const seller=i.seller===st.me;if(a==='confirm'){show(label(a,i),summary(i)+'<p class="note">'+(seller?'请先在闲鱼订单和实际收款账单中核对已放款到账。买家已付款、平台担保中或仍待放款时，请等实际到账后再确认。':'请先实际收到并核实商品或服务，再从本人的闲鱼订单详情复制订单号。')+'</p><form id="cf"><label>闲鱼订单号<input name="orderNumber" inputmode="numeric" type="text" autocomplete="off" pattern="[0-9]{8,32}" maxlength="32" minlength="8" required></label><p class="tiny">仅用于核对双方填写的订单。请勿输入登录密码、验证码、支付流水号或运单号。</p><label class="check"><input type="checkbox" required>'+esc(seller?'我已实际收到这笔订单释放的货款。':'我本人已实际收到本单商品或服务。')+'</label><button class="primary">提交我的确认</button></form>','confirm');$('#cf').onsubmit=e=>{e.preventDefault();post({action:'confirm',id:i.id,orderNumber:new FormData(e.target).get('orderNumber').trim(),attested:true})};return}
const msg=a==='claim'?'登记后，本站暂时为你保留这条商品记录。闲鱼上的库存和订单状态由闲鱼管理。请只在闲鱼官方页面或应用中登录、下单和付款。':a==='dispute'?'争议将停止本站的成交确认。涉及钱款或退货的处理请通过闲鱼订单进行。':i.status==='open'?'撤下本站商品记录后，闲鱼上的商品仍由你自行管理。':'撤回后该商品将重新出现在本站市场。闲鱼订单如需取消，请在闲鱼单独办理。';show(label(a,i),summary(i)+'<p class="note">'+msg+'</p><div class="actions"><button class="primary" id="go">'+label(a,i)+'</button><button id="back">返回详情</button></div>','action');$('#go').onclick=()=>post({action:a,id:i.id});$('#back').onclick=detail}
function publish(){sel=null;show('发布闲鱼商品','<p class="note">还没有闲鱼商品？请先在闲鱼上架自己的商品。 <a href="https://www.goofish.com/" target="_blank" rel="noopener noreferrer">去闲鱼官网 ↗</a></p><form id="new"><label>商品名称<input name="title" maxlength="80" required></label><div class="cols"><label>商品类别<select name="category"><option value="camera">相机器材</option><option value="game">游戏资产</option><option value="service">服务</option></select></label><label>闲鱼商品价格（元）<input type="number" name="price" min="0.01" max="1000000" step=".01" required></label></div><label>你的闲鱼卖家昵称<input name="sellerName" maxlength="80" required></label><label>闲鱼官方商品链接<input type="url" name="externalUrl" autocomplete="off" placeholder="https://www.goofish.com/item?id=…" required></label><p class="tiny">请用电脑浏览器打开自己的闲鱼商品详情页，从地址栏复制含 item?id=数字 的完整网址。手机分享的 m.tb.cn 短链接或整段口令无法直接填写。</p><label>商品及交付约定<textarea name="terms" maxlength="1200" rows="3" required></textarea></label><label class="check"><input type="checkbox" required>这是我有权出售的商品，所填昵称、价格及交付约定与闲鱼商品页相符。</label><button class="primary">发布商品</button></form>','publish');$('#new').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),url=official(f.get('externalUrl').trim());if(!url){$('#err').textContent='请填写闲鱼官方商品详情页链接，地址中需含数字商品编号。';return}post({action:'list',category:f.get('category'),title:f.get('title').trim(),terms:f.get('terms').trim(),sellerName:f.get('sellerName').trim(),price:Math.round(Number(f.get('price'))*100),externalUrl:url,sellerAttested:true})}}
async function post(p){if(busy)return;busy=true;turn++;modal.querySelectorAll('button').forEach(b=>b.disabled=true);
try{const sig=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(p)))),b=>b.toString(16).padStart(2,'0')).join('');if(retry?.sig!==sig)retry={sig,key:crypto.randomUUID()};st=await api('action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,idempotencyKey:retry.key})});retry=null;tab='mine';render();sel=st.actedId||p.id;notice(p.action==='confirm'&&item()?.status==='pending'?'你的声明已保存，等待另一方填写同一笔订单号。':'操作已记录。');if(item())detail();else{modal.close();panel.replaceChildren();sel=null;screen=null}}
catch(e){$('#err').textContent=e.message}finally{busy=false;modal.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('#publish').onclick=publish;document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-nav]');if(b){tab=b.dataset.nav;render();reload().catch(e=>notice(e.message))}};
content.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.id){sel=b.dataset.id;detail()}else if(b.hasAttribute('data-refresh'))reload().then(()=>notice('已刷新。')).catch(e=>notice(e.message))};
panel.onclick=e=>{const b=e.target.closest('[data-flow]');if(b)flow(b.dataset.flow)};
setInterval(()=>{if(!document.hidden&&!busy&&(!modal.open||screen==='detail'))reload().catch(()=>{})},20000);
reload().catch(e=>{notice(e.message);content.innerHTML='<div class="empty">市场暂时无法读取。 <button data-refresh>重试</button></div>'});
</script></body></html>
