7;font-size:14px}.ledger{display:grid;grid-template-columns:70px 1fr 2fr;gap:14px;align-items:center}.ledger code{font-size:12px;overflow-wrap:anywhere;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:17px;box-shadow:0 20px 80px #1233;max-width:min(520px,94vw);width:520px;color:var(--ink);padding:24px;max-height:88vh}dialog::backdrop{background:#0d221e81}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.close{font-size:20px;padding:0;width:34px;height:34px}label{display:grid;gap:4px;margin:10px 0;font-size:14px;font-weight:600}input,textarea,select{border:1px solid #b7c3b7;border-radius:7px;padding:8px;background:#fff;color:var(--ink);min-width:0;width:100%}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.error{color:#953b22;white-space:pre-line}.statusmsg{margin:10px 0;color:var(--green)}.statusmsg:empty,.error:empty{display:none}.stage{display:grid;grid-template-columns:1fr 100px auto;gap:6px;margin-bottom:7px}main{padding-bottom:55px!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{right:4%;width:140px}}@media(max-width:620px){.wrap{padding:0 16px}.hero{margin-top:16px}.hero p{max-width:70%;font-size:13px}.art{width:74px;height:88px;right:6%;opacity:.7}.art i:last-child:after{font-size:30px}.grid{grid-template-columns:1fr}.wallet{text-align:right}.wallet b{display:block}.bar{gap:7px}nav button{padding:7px 9px}.bar>.primary{padding:7px 10px}.ledger{grid-template-columns:48px 1fr}.ledger code{grid-column:1/-1}.card{padding:17px}}
.mode-switch{margin-left:auto;font-weight:700;color:var(--green);text-underline-offset:4px}.wallet{flex-shrink:0}@media(max-width:480px){.mode-switch{font-size:13px}header .wrap{gap:6px}.brand{font-size:19px}}
:root{--green:#74401e;--mint:#ffd4a6;--ink:#362b20;--muted:#675e52;--line:#ded9cf;--paper:#f6f4ed}.hero{background:#483022}.hero:before{background:radial-gradient(ellipse at 85% 92%,#a77942,transparent 50%),repeating-linear-gradient(90deg,transparent 0 47px,#fff1 48px),repeating-linear-gradient(0deg,transparent 0 47px,#fff1 48px)}.hero .eyebrow,.hero p{color:#f6e4cd}.art i{border-color:#d6b88c;background:#896c4d}.art i:last-child{background:linear-gradient(135deg,#f5d9ab,#c0996b)}.art i:last-child:after{content:"¥";color:#755130}.tag{background:#f1e7d8;color:#705033}.note{border-color:#b28b59;background:#f5eee4}.state{white-space:nowrap}.payment{border:1px solid #dbc4a7;background:#fff8ed;border-radius:12px;padding:15px;margin:14px 0}.terms{white-space:pre-wrap;overflow-wrap:anywhere}.check{display:flex;align-items:flex-start;gap:9px;font-weight:500}.check input{width:17px;height:17px;flex:none;margin-top:4px}.qr{display:grid;place-items:center;max-width:270px;margin:15px auto 3px}.qr svg{width:100%;height:auto}.detail dl{margin:14px 0}.detail dt{font-size:12px;color:var(--muted)}.detail dd{margin:0 0 8px;overflow-wrap:anywhere}.record h3{font-size:18px}.empty strong{display:block;color:var(--ink);margin-bottom:4px}.section-title>div{display:flex;gap:8px}.terms + footer{margin-top:10px}.event-meta{display:flex;gap:10px;flex-wrap:wrap}.muted a,a{color:var(--green);text-underline-offset:3px}.plain{border:none;background:transparent;padding:3px;text-decoration:underline}.notice{margin:12px 0;color:#694421}.notice:empty{display:none}.tiny{color:var(--muted);font-size:12px}.formaction{margin-top:14px}.readmore{margin:8px 0;font-size:13px}.readmore summary{cursor:pointer}.first{margin-right:auto}.card .terms{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card .price:before{content:none}.wallet{color:var(--ink)}.hero p{max-width:72%}button[aria-current="page"]{background:var(--green);color:white}@media(max-width:520px){.ledger{grid-template-columns:45px 1fr}.modalhead{gap:10px}.hero p{max-width:77%}.bar{align-items:flex-start}.hero{border-radius:16px}nav{gap:2px}nav button{font-size:14px}}
.mode-links{margin-left:auto;display:flex;gap:15px;align-items:center}.mode-links a{font-size:14px;color:var(--green);font-weight:650;text-underline-offset:3px}@media(max-width:550px){.mode-links{gap:6px;flex-wrap:wrap;justify-content:flex-end}.mode-links a{font-size:12px}.wallet{font-size:11px}.wallet b{font-size:14px}}
</style></head><body><header><div class="wrap"><div class="brand"><span class="mark" aria-hidden="true">≋</span>有据</div><div class="mode-links"><a href="/personal">个人卖家 · 闲鱼</a><a href="/">模拟市场</a></div></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow"><i></i> 微信支付 / 商户直收</div><h1>商户直收市场</h1><p>买家向商户直接付款，双方在这里记录收款、交付与验收。</p><div class="art" aria-hidden="true"><i></i><i></i><i></i></div></section>
<div class="bar"><nav aria-label="直收市场导航"><button data-nav="open" aria-current="page">在售商品</button><button data-nav="mine">我的交易</button><button data-nav="ledger">直收账本</button></nav><button id="publish" class="primary" disabled>＋ 发布商品</button></div>
<p id="notice" class="notice" role="status"></p><section id="content"><p>正在读取商品…</p></section></main>
<dialog id="modal" aria-labelledby="dialogTitle"><div class="dialoghead"><h2 id="dialogTitle"></h2><button id="close" class="close" aria-label="关闭">×</button></div><div id="body"></div><p id="err" class="error" role="alert"></p></dialog>
<script src="/qr-lib.js"></script><script>
'use strict';
const $=s=>document.querySelector(s),modal=$('#modal'),panel=$('#body'),content=$('#content');
const categories={camera:'相机器材',game:'游戏资产',service:'服务'};
const titles={open:'在售',awaiting_code:'等待卖家提供付款码',awaiting_payment:'等待买家付款声明',buyer_paid:'买家已声明付款',seller_received:'卖家已确认到账',delivered:'卖家已声明交付',completed:'买家已确认收货',disputed:'争议处理中',closed_dispute:'争议记录已关闭',cancelled:'已取消',canceled:'已取消',withdrawn:'已撤下'};
const actions={list:'发布商品',order:'创建直收订单',code:'提交订单付款码',paid:'声明本人已付款',payment_received:'确认实际到账',deliver:'标记已交付',receive:'确认已收货',cancel:'取消',dispute:'发起争议',close_dispute:'关闭争议记录'};
const prompts={order:'创建订单将为你锁定此商品。卖家提交本单付款码后，你可以核对收款信息并用微信扫码。',paid:'请先查看本人微信支付账单。提交后，本站将记录你的付款声明，卖家随后可查看声明、核对到账。',payment_received:'请先在自己的微信支付商户账单中核实这笔订单的金额和交易状态。',deliver:'请先按照约定完成发货或服务交付，再记录本次交付。',receive:'请先亲自核实商品或服务已按约收到。确认后订单将显示完成。',cancel:'取消后，此笔直收交易将停止。',dispute:'发起后订单将暂停。平台不冻结资金，也不会自动退款。请双方另行联系处理。',close_dispute:'关闭仅结束本站争议记录。请自行核对线下处理情况，退款以微信支付账单为准。'};
const buttons={order:'确认创建订单',paid:'我已核实并实际付款',payment_received:'我已核实实际到账',deliver:'我已实际交付',receive:'我已验收并收到',cancel:'确认取消',dispute:'确认发起争议',close_dispute:'确认关闭争议记录'};
let state=null,tab='open',selected=null,subview=null,busy=false,loadNo=0,keyCache=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yuan=c=>'¥'+(Number(c)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=t=>new Date(t).toLocaleString('zh-CN',{hour12:false});
const current=()=>state?.items.find(x=>x.id===selected);
function message(s){$('#notice').textContent=s}
function show(title,html,mode){subview=mode;$('#dialogTitle').textContent=title;$('#err').textContent='';panel.innerHTML=html;if(!modal.open)modal.showModal()}
function shut(){if(!busy){modal.close();selected=null;subview=null;panel.replaceChildren()}}
$('#close').onclick=shut;modal.addEventListener('cancel',e=>{e.preventDefault();shut()});
async function request(path,config={}){const r=await fetch('/api/real/'+path,{cache:'no-store',...config});let json;try{json=await r.json()}catch{throw Error('服务暂时无法读取，请稍后刷新。')}if(!r.ok||json.error)throw Error(json.error||'操作失败，请刷新查看当前状态。');return json}
async function reload(){const n=++loadNo;const s=await request('state');if(n!==loadNo)return;const old=current()?.status;state=s;render();if(!modal.open||!current())return;if(old!==current().status||subview==='detail')detail();else if(subview==='qr')paintQR()}
function render(){if(!state)return;$('#publish').disabled=false;document.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
const heading='<div class="section-title"><h2>'+({open:'在售商品',mine:'我的交易',ledger:'直收账本'})[tab]+'</h2><div>'+(tab==='ledger'?'<a href="/api/real/ledger" download>下载账本</a>':'')+'<button data-refresh>刷新</button></div></div>';
if(tab==='ledger'){content.innerHTML=heading+'<p class="small">公开记录由本站维护。付款与收款状态来自买卖双方人工声明；微信支付账单可用于核实实际资金流动。</p>'+([...state.blocks].reverse().map(b=>'<article class="record ledger"><b>#'+esc(b.index??b.height)+'</b><div>'+esc(actions[b.action]||b.action)+'<br><small>'+esc(fmt(b.time))+'</small></div><code>'+esc(b.hash)+'</code></article>').join('')||'<p class="empty">暂无直收交易记录。</p>');return}
const items=state.items.filter(i=>tab==='open'?i.status==='open':i.buyer===state.me||i.seller===state.me).slice().sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
content.innerHTML=heading+(tab==='mine'?'<p class="small">订单属于此浏览器身份。请保留该浏览器的站点数据，以便继续操作。</p>':'<p class="small">真实交易款直接付至商户。本站提供订单记录，不代收款项、不收取平台费。</p>')+'<div class="grid">'+(items.map(i=>'<article class="card"><div class="row"><span class="tag">'+esc(categories[i.category])+'</span><span class="state">'+esc(titles[i.status]||i.status)+'</span></div><h3>'+esc(i.title)+'</h3><div class="small">收款商户（卖家自报）<br><strong>'+esc(i.merchantName)+'</strong></div><div class="terms small">'+esc(i.terms)+'</div><footer class="row"><b class="price">'+yuan(i.price)+'</b><button data-item="'+esc(i.id)+'">'+(tab==='open'?'查看商品':'查看订单')+'</button></footer></article>').join('')||'<div class="empty"><strong>'+(tab==='open'?'暂时没有在售商品':'这里还没有你的直收订单')+'</strong>'+(tab==='open'?'持有微信支付商户号的卖家可发布第一件商品。':'下单或发布商品后，可在这里查看进度。')+'</div>')+'</div>'}
function summary(i){return '<div class="detail"><div class="row"><span class="tag">'+esc(categories[i.category])+'</span><span class="state">'+esc(titles[i.status]||i.status)+'</span></div><h3 style="margin:12px 0 2px">'+esc(i.title)+'</h3><p style="font-size:24px;font-weight:bold">'+yuan(i.price)+'</p><dl><dt>微信支付收款商户（卖家自报，未经本站核验）</dt><dd>'+esc(i.merchantName)+'</dd><dt>卖家账户</dt><dd>'+esc(i.seller)+'</dd><dt>商品 / 订单编号</dt><dd>'+esc(i.id)+'</dd><dt>交付与售后约定</dt><dd class="terms">'+esc(i.terms)+'</dd></dl></div>'}
function allowed(i){const seller=i.seller===state.me,buyer=i.buyer===state.me;if(!seller&&!buyer)return i.status==='open'?['order']:[];let a=[];switch(i.status){case 'open':if(seller)a.push('cancel');break;case 'awaiting_code':if(seller)a.push('code');a.push('cancel');break;case 'awaiting_payment':if(i.paymentUrl&&Date.parse(i.expiresAt)>Date.now())a.push('qr');if(buyer)a.push('paid');break;case 'buyer_paid':if(seller)a.push('payment_received');break;case 'seller_received':if(seller)a.push('deliver');break;case 'delivered':if(buyer)a.push('receive');break;case 'disputed':if(i.disputer!==state.me)a.push('close_dispute');break}
if(['awaiting_payment','buyer_paid','seller_received','delivered'].includes(i.status))a.push('dispute');return a}
function detail(){const i=current();if(!i)return;const desc={awaiting_code:'卖家需在自己的微信支付商户系统中为本单生成等额 Native 付款码。',awaiting_payment:Date.parse(i.expiresAt)<=Date.now()?'付款码已过期。已付款可根据微信账单声明；未付款请与卖家协商。':'付款前请在微信支付界面核对商户名称与订单金额。',buyer_paid:'买家已提交付款声明，等待卖家通过自己的微信支付商户账单核实到账。',seller_received:'卖家已手动确认到账，等待实际交付。',delivered:'卖家已手动标记交付，等待买家确认收货。',completed:'买家已确认实际收到商品或服务。',closed_dispute:'对方已关闭争议记录。本站没有确认退款或资金赔付。',disputed:'等待对方处理争议。本站不自动冻结资金或退款。'};
show(i.status==='open'?'商品详情':'直收订单',summary(i)+(desc[i.status]?'<p class="note">'+esc(desc[i.status])+'</p>':'')+'<div class="actions">'+allowed(i).map((a,j)=>'<button class="'+(j?'':'primary')+'" data-flow="'+a+'">'+esc(a==='qr'?'显示本单付款码':i.status==='open'&&a==='cancel'?'撤下商品':actions[a])+'</button>').join('')+'</div>','detail')}
function flow(a){const i=current();if(!i||!allowed(i).includes(a)){detail();return}if(a==='qr'){paintQR();return}if(a==='code'){show('提交本单付款码',summary(i)+'<p class="note">先用自己的微信支付商户系统生成与本单金额完全一致的 Native 支付订单。链接仅向交易双方显示，提交后不可替换。</p><form id="codeForm"><label>微信支付 Native 订单链接<input id="payUrl" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="weixin://wxpay/bizpayurl?pr=…" required></label><label>商户订单实际过期时间（本地时间）<input type="datetime-local" id="expires" required></label><small>请按商户系统的截止时间填写，须在未来两小时内。</small><label class="check"><input type="checkbox" required>我已核对这张订单码属于上述收款商户，金额为 '+yuan(i.price)+'。</label><button class="primary">提交本单付款码</button></form>','code');$('#codeForm').onsubmit=e=>{e.preventDefault();const url=$('#payUrl').value.trim(),expires=Date.parse($('#expires').value);if(!/^weixin:\/\/wxpay\/bizpayurl\?pr=[A-Za-z0-9_-]{4,128}$/.test(url)||!Number.isFinite(expires)||expires<=Date.now()||expires>Date.now()+7200000){$('#err').textContent='请核对 Native 订单链接和商户订单实际截止时间。';return}post({action:'code',id:i.id,paymentUrl:url,expiresAt:new Date(expires).toISOString()})};return}
show(actions[a],summary(i)+'<p class="note">'+esc(prompts[a])+'</p><div class="actions"><button id="confirm" class="primary">'+esc(buttons[a])+'</button><button id="back">返回详情</button></div>','confirm');$('#confirm').onclick=()=>post({action:a,id:i.id});$('#back').onclick=detail}
function paintQR(){const i=current();if(!i||!allowed(i).includes('qr')){detail();return}show('本单微信付款码','<div class="payment"><p>微信支付收款商户（卖家自报）<br><strong>'+esc(i.merchantName)+'</strong></p><p>应付金额　<b>'+yuan(i.price)+'</b></p><div class="qr" id="qr" role="img" aria-label="本订单的微信支付二维码"></div><p class="tiny">有效至 '+esc(fmt(i.expiresAt))+'</p></div><p>请用另一台设备的微信扫一扫，并在微信中核对金额和收款商户。信息不符时请停止付款。</p><button id="back">返回订单</button>','qr');try{if(!/^weixin:\/\/wxpay\/bizpayurl\?pr=[A-Za-z0-9_-]{4,128}$/.test(i.paymentUrl))throw Error();const q=window.qrcode(0,'M');q.addData(i.paymentUrl);q.make();$('#qr').innerHTML=q.createSvgTag()}catch{$('#qr').textContent='此付款码暂时无法显示，请返回订单刷新。'}$('#back').onclick=detail}
function listing(){selected=null;show('发布直收商品','<form id="listForm"><label>商品或服务名称<input name="title" maxlength="80" required></label><div class="cols"><label>商品类别<select name="category"><option value="camera">相机器材</option><option value="game">游戏资产</option><option value="service">服务</option></select></label><label>成交金额（人民币元）<input name="price" type="number" min="0.01" max="1000000" step="0.01" required></label></div><label>微信支付界面显示的收款商户名称<input name="merchantName" maxlength="80" required></label><label>交付与售后约定<textarea name="terms" rows="3" maxlength="1200" placeholder="说明交付内容、方式、时间及售后条件" required></textarea></label><p class="tiny">商品与商户资料将公开展示。请勿填写个人联系方式、付款码或买家私人信息。</p><label class="check"><input type="checkbox" required>我有权代表该商户收款，并能为每笔订单通过微信支付商户系统生成等额 Native 付款码。</label><button class="primary formaction">确认发布</button></form>','list');$('#listForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);post({action:'list',title:f.get('title').trim(),category:f.get('category'),price:Math.round(Number(f.get('price'))*100),merchantName:f.get('merchantName').trim(),terms:f.get('terms').trim(),merchantAttested:true})}}
async function post(p){if(busy)return;busy=true;loadNo++;const serial=JSON.stringify(p);if(keyCache?.serial!==serial)keyCache={serial,key:Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('')};modal.querySelectorAll('button').forEach(b=>b.disabled=true);
try{state=await request('action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,idempotencyKey:keyCache.key})});keyCache=null;tab='mine';render();selected=state.actedId||p.id;message('已记录：'+actions[p.action]+'。');if(current())detail();else{modal.close();panel.replaceChildren();selected=null;subview=null}}
catch(e){$('#err').textContent=e.message}finally{busy=false;modal.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('#publish').onclick=listing;document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-nav]');if(!b)return;tab=b.dataset.nav;render();reload().catch(e=>message(e.message))};
content.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-refresh'))reload().then(()=>message('已刷新。')).catch(e=>message(e.message));if(b.dataset.item){selected=b.dataset.item;detail()}};panel.onclick=e=>{const b=e.target.closest('[data-flow]');if(b)flow(b.dataset.flow)};
setInterval(()=>{if(!busy&&!document.hidden&&(!modal.open||['detail','qr'].includes(subview)))reload().catch(()=>{})},12000);
setInterval(()=>{if(subview==='qr'&&current()&&Date.parse(current().expiresAt)<=Date.now())detail()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy)reload().catch(()=>{})});
reload().catch(e=>{message(e.message);content.innerHTML='<div class="empty">暂时无法读取直收市场。 <button data-refresh>重试</button></div>'});
</script></body></html>
